@font-face{font-family:"Lobster";src:url(data:font/woff2;base64,__LOBSTER__) format("woff2");font-display:block}

:root{--ink:#1c1233;--red:#ff3b4e;--green:#1fc46b;--gold:#ffc928;--pink:#ff4fa8;--blue:#2f8cff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1e2447;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0;font-family:"Lilita One",system-ui,sans-serif}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;opacity:0;transition:opacity .5s}
body.ready #c{opacity:1}

/* Botón de sonido */
#mute{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:5;
  width:48px;height:48px;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);
  background:rgba(12,18,70,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .15s}
#mute:active{transform:scale(.9)}
#mute svg{width:26px;height:26px}
#mute .off{display:none}
#mute.muted .on{display:none}
#mute.muted .off{display:block}

/* Indicación inicial */
#hint{position:absolute;left:0;top:0;z-index:4;width:44px;height:48px;visibility:hidden;pointer-events:none;
  filter:drop-shadow(0 3px 5px rgba(5,8,40,.45));will-change:transform}
#hint.show,#hint.hide{visibility:visible}
#hint svg{width:100%;height:100%;overflow:visible;transform-origin:50% 100%}
/* aparece y desaparece con squash and stretch, igual que las frutas */
#hint.show svg{animation:hintIn .6s cubic-bezier(.3,1.2,.5,1) both}
#hint.hide svg{animation:hintOut .5s ease-in both}
@keyframes hintIn{0%{transform:scale(0)}35%{transform:scale(1.28,.68)}55%{transform:translateY(-8px) scale(.8,1.28)}75%{transform:scale(1.1,.92)}100%{transform:none}}
@keyframes hintOut{0%{transform:none}20%{transform:translateY(4px) scale(1.3,.7)}45%{transform:translateY(-14px) scale(.78,1.32)}65%{transform:translateY(-14px) scale(1.15,.88)}100%{transform:translateY(-14px) scale(0) rotate(14deg)}}
#hint .hand{animation:tap .9s ease-in-out infinite;transform-origin:150px 279px}
#hint .ring{fill:none;stroke:#fff;stroke-width:10;transform-origin:101px 10px;animation:ring .9s ease-out infinite}
@keyframes tap{0%,100%{transform:translateY(-22px)}45%,60%{transform:translateY(0) scale(.97,1.03)}}
@keyframes ring{0%,40%{transform:scale(.2);opacity:0}50%{opacity:.95}100%{transform:scale(1.5);opacity:0}}

/* Mensaje final */
#final{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(18px,4vh,34px);visibility:hidden;pointer-events:none}
#final::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .6s;
  background:radial-gradient(ellipse 85% 65% at 50% 50%,rgba(14,22,78,.92),rgba(14,22,78,.6) 65%,rgba(14,22,78,.2));
  -webkit-mask-image:linear-gradient(transparent 20%,#000 34%);mask-image:linear-gradient(transparent 20%,#000 34%)}
#final.show{visibility:visible;pointer-events:auto}
#final.show::before{opacity:1}
.msg{text-align:center;max-width:min(92vw,640px);padding:0 6px;text-shadow:0 2px 10px rgba(5,8,40,.45)}
.msg>div:not(.l3){opacity:0;transform:translateY(18px) scale(.92)}
#final.show .msg>div:not(.l3){animation:pop .8s cubic-bezier(.3,1.4,.5,1) forwards}
#final.show .l2{animation-delay:.3s!important}
#final.show .l4{animation-delay:.6s!important}
@keyframes pop{to{opacity:1;transform:none}}
.l3{margin:clamp(10px,2.2vh,20px) 0}
.title-svg,.words-svg{display:block;height:auto;margin:0 auto;filter:drop-shadow(0 2px 6px rgba(5,8,40,.4))}
.title-svg{width:min(86vw,620px)}
.words-svg{width:min(86vw,640px)}
.words-svg .cm{opacity:0}
#final.show .words-svg .cm{animation:fade .5s .35s forwards}
@keyframes fade{to{opacity:1}}
.l2,.l4{font-family:"Nunito",sans-serif;font-weight:700;font-size:clamp(18px,5vw,28px);line-height:1.3;color:#fff6e0;text-wrap:balance}
.l2{margin-top:clamp(12px,2.6vh,24px)}
.l4 b{font-weight:800;font-size:1.3em;color:#ffc928}
#again{font-family:"Lilita One",sans-serif;font-size:clamp(19px,5vw,26px);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:14px 32px;border-radius:999px;border:3.5px solid #fff;
  background:linear-gradient(180deg,#ff5d9a,#ff2f6f);box-shadow:0 7px 0 #a3134b,0 14px 28px rgba(0,0,0,.45);
  text-shadow:0 2px 0 rgba(120,0,40,.5);opacity:0;transform:translateY(20px);transition:transform .12s}
#final.show #again{animation:pop .6s 1.2s cubic-bezier(.3,1.7,.45,1) forwards,pulse 1.6s 1.9s ease-in-out infinite}
#again:active{box-shadow:0 2px 0 #a3134b,0 6px 14px rgba(0,0,0,.4);translate:0 5px}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.05}}

@media (orientation:landscape) and (max-height:520px){
  .title-svg{width:min(70vw,95vh)}.words-svg{width:min(72vw,100vh)}.l2,.l4{font-size:4.6vh}#final{gap:2vh}
}
@media (prefers-reduced-motion:reduce){#again,#hint .hand,#hint .ring{animation-iteration-count:1!important}}
